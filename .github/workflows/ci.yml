name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q

  evals:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: cd backend && uv sync
      - name: Forecast must beat the persistence baseline
        run: |
          backend/.venv/bin/python evals/forecast_eval.py --seeds 10 --out /tmp/forecast.json
          backend/.venv/bin/python -c "import json,sys; r=json.load(open('/tmp/forecast.json'))['results']; sys.exit(0 if all(v['improvement_pct']>15 for v in r.values()) else 1)"
      - name: Assistant must be grounded, accurate and leak-free
        run: |
          backend/.venv/bin/python evals/assistant_eval.py --seeds 5 --out /tmp/assistant.json
          backend/.venv/bin/python -c "import json,sys; r=json.load(open('/tmp/assistant.json')); sys.exit(0 if r['grounded_pct']==100 and r['exact_answer_accuracy']>=95 and r['privacy_pass'] else 1)"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
