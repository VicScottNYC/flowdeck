[project]
name = "flowdeck"
version = "0.1.0"
description = "Real-time hospital operations layer on top of legacy HIS HL7 v2 feeds"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
foundry = ["azure-ai-projects>=2.0", "azure-identity>=1.19"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "fhir.resources>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowdeck"]

[tool.pytest.ini_options]
pythonpath = ["src", "../simulator"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
